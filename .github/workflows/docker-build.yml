name: Production Docker Build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build production image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: production
          push: false
          build-args: |
            VCS_REF=${{ github.sha }}
            VCS_DIRTY=0
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Build benchmark image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: benchmark
          push: false
          build-args: |
            VCS_REF=${{ github.sha }}
            VCS_DIRTY=0
          cache-from: type=gha,scope=benchmark
          cache-to: type=gha,mode=max,scope=benchmark
