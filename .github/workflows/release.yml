name: Publish Release Images

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ghcr-release-${{ github.repository }}
  queue: max

jobs:
  publish:
    if: github.event.repository.private == false
    runs-on:
      - self-hosted
      - linux
      - x64
      - trtvideo-release
    environment: ghcr-release
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      MODEL_TOOLS_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/trtvideo-model-tools
      HAS_NGC_KEY: ${{ secrets.NGC_API_KEY != '' }}

    steps:
      - name: Check out the released tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate release contract
        id: release
        env:
          APPROVED: ${{ vars.GHCR_REDISTRIBUTION_APPROVED }}
          MODEL_TOOLS_APPROVED: ${{ vars.GHCR_MODEL_TOOLS_REDISTRIBUTION_APPROVED }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          for command in awk docker git gh make; do
            command -v "$command" >/dev/null || {
              echo "Release runner is missing required command: $command" >&2
              exit 2
            }
          done
          docker info >/dev/null

          if [[ "$APPROVED" != "true" ]]; then
            echo "GHCR_REDISTRIBUTION_APPROVED must be true in ghcr-release." >&2
            exit 2
          fi
          if [[ "$MODEL_TOOLS_APPROVED" != "true" ]]; then
            echo "GHCR_MODEL_TOOLS_REDISTRIBUTION_APPROVED must be true in ghcr-release." >&2
            exit 2
          fi

          version="$(
            awk '
              $0 == "[project]" { in_project = 1; next }
              /^\[/ { in_project = 0 }
              in_project && /^version = "[^"]+"$/ {
                value = $0
                sub(/^version = "/, "", value)
                sub(/"$/, "", value)
                print value
                found = 1
                exit
              }
              END { if (!found) exit 1 }
            ' pyproject.toml
          )"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match project version $version." >&2
            exit 2
          fi

          revision="$(git rev-parse HEAD)"
          tag_revision="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$revision" != "$tag_revision" ]]; then
            echo "Checkout does not resolve to the released tag." >&2
            exit 2
          fi
          git merge-base --is-ancestor "$revision" origin/main || {
            echo "Released revision is not contained in origin/main." >&2
            exit 2
          }
          test -z "$(git status --porcelain)" || {
            echo "Release checkout is dirty." >&2
            exit 2
          }

          available_kib="$(df --output=avail -k . | tail -n 1)"
          required_kib=$((80 * 1024 * 1024))
          if (( available_kib < required_kib )); then
            echo "Release runner needs at least 80 GiB free; found $((available_kib / 1024 / 1024)) GiB." >&2
            exit 2
          fi

          {
            echo "version=$version"
            echo "revision=$revision"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to NVIDIA NGC
        if: env.HAS_NGC_KEY == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ secrets.NGC_API_KEY }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare production candidate
        id: production_image
        uses: ./.github/actions/release-candidate
        with:
          image: ${{ env.IMAGE_NAME }}
          target: production
          version: ${{ steps.release.outputs.version }}
          revision: ${{ steps.release.outputs.revision }}
          build-date: ${{ steps.release.outputs.build_date }}

      - name: Prepare model-tools candidate
        id: model_tools_image
        uses: ./.github/actions/release-candidate
        with:
          image: ${{ env.MODEL_TOOLS_IMAGE_NAME }}
          target: model-tools
          version: ${{ steps.release.outputs.version }}
          revision: ${{ steps.release.outputs.revision }}
          build-date: ${{ steps.release.outputs.build_date }}

      - name: Smoke-test production candidate packaging
        env:
          IMAGE_DIGEST: ${{ steps.production_image.outputs.digest }}
        run: |
          set -euo pipefail
          reference="$IMAGE_NAME@$IMAGE_DIGEST"
          docker run --rm "$reference" trtvideo --help >/dev/null
          docker run --rm "$reference" trtvideo doctor --help >/dev/null
          docker run --rm "$reference" trtvideo compatibility-check --help >/dev/null
          docker run --rm "$reference" trtvideo compatibility-report --help >/dev/null
          if output="$(docker run --rm "$reference" trtvideo compatibility-check \
            --checkpoint /tmp/model.pth \
            --model-name smoke \
            --model-source https://example.invalid/model \
            --model-license MIT \
            --output-dir /tmp/report 2>&1)"; then
            echo "Production image unexpectedly ran compatibility-check." >&2
            exit 2
          fi
          grep -F "Checkpoint compatibility requires the model-tools image" \
            <<<"$output" >/dev/null
          docker run --rm "$reference" build-engine --help >/dev/null
          docker run --rm "$reference" sh -ec '
            command -v trtvideo
            command -v build-engine
            command -v prepare-compatibility-input
            for cmd in export-onnx prepare-onnx benchmark-trtvideo; do
              if command -v "$cmd"; then echo "Unexpected production command: $cmd" >&2; exit 2; fi
            done
            python3 -c "import importlib.util; assert importlib.util.find_spec(\"torch\") is None"
            test -f /usr/share/doc/trtvideo/LICENSE
            test -f /usr/share/doc/trtvideo/THIRD_PARTY_NOTICES.md
            test -f /usr/share/doc/trtvideo/LICENSING.md
            test -f /opt/nvidia/entrypoint.d/30-container-license.txt
          '
          docker run --rm "$reference" sh -ec '
            python3 -c "from onnx import TensorProto, helper; i = helper.make_tensor_value_info(\"input\", TensorProto.FLOAT, [1, 3, 16, 16]); o = helper.make_tensor_value_info(\"output\", TensorProto.FLOAT, [1, 3, 32, 32]); m = helper.make_model(helper.make_graph([], \"smoke\", [i], [o])); import onnx; onnx.save(m, \"/tmp/static.onnx\")"
            trtvideo compatibility-check \
              --onnx /tmp/static.onnx \
              --model-name smoke \
              --model-source https://example.invalid/model \
              --model-license MIT \
              --output-dir /tmp/report \
              --dry-run >/dev/null
            test ! -e /tmp/report
          '

      - name: Smoke-test model-tools candidate packaging
        env:
          MODEL_TOOLS_DIGEST: ${{ steps.model_tools_image.outputs.digest }}
        run: |
          set -euo pipefail
          reference="$MODEL_TOOLS_IMAGE_NAME@$MODEL_TOOLS_DIGEST"
          docker run --rm "$reference" trtvideo demo --help >/dev/null
          docker run --rm "$reference" trtvideo compatibility-check --help >/dev/null
          docker run --rm "$reference" trtvideo compatibility-report --help >/dev/null
          docker run --rm "$reference" export-onnx --help >/dev/null
          docker run --rm "$reference" prepare-onnx --help >/dev/null
          docker run --rm "$reference" prepare-compatibility-input --help >/dev/null
          docker run --rm "$reference" build-engine --help >/dev/null
          docker run --rm "$reference" sh -ec '
            test "$TRTVIDEO_IMAGE_VARIANT" = model-tools
            test -n "$TRTVIDEO_IMAGE_REF"
            command -v trtvideo
            command -v export-onnx
            command -v prepare-onnx
            command -v prepare-compatibility-input
            command -v build-engine
            if command -v benchmark-trtvideo; then echo "Unexpected benchmark command" >&2; exit 2; fi
            python3 -c "import torch, spandrel, onnxruntime; print(torch.__version__)"
            test -f /usr/share/doc/trtvideo/LICENSE
            test -f /usr/share/doc/trtvideo/THIRD_PARTY_NOTICES.md
            test -f /usr/share/doc/trtvideo/LICENSING.md
          '
          docker run --rm "$reference" sh -ec '
            touch /tmp/model.pth
            trtvideo compatibility-check \
              --checkpoint /tmp/model.pth \
              --model-name smoke \
              --model-source https://example.invalid/model \
              --model-license MIT \
              --output-dir /tmp/report \
              --dry-run >/dev/null
            test ! -e /tmp/report
          '

      - name: Verify unauthenticated pulls
        env:
          IMAGE_DIGEST: ${{ steps.production_image.outputs.digest }}
          MODEL_TOOLS_DIGEST: ${{ steps.model_tools_image.outputs.digest }}
        run: |
          set -euo pipefail
          anonymous=$(mktemp -d)
          trap 'rm -rf -- "$anonymous"' EXIT
          # An explicit empty entry also disables auto-detection of host credential helpers.
          printf '%s\n' '{"auths":{"ghcr.io":{}}}' > "$anonymous/config.json"
          docker --config "$anonymous" pull "$IMAGE_NAME@$IMAGE_DIGEST"
          docker --config "$anonymous" pull "$MODEL_TOOLS_IMAGE_NAME@$MODEL_TOOLS_DIGEST"

      - name: Verify both digests on GPU, then promote without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION: ${{ env.IMAGE_NAME }}@${{ steps.production_image.outputs.digest }}
          MODEL_TOOLS: ${{ env.MODEL_TOOLS_IMAGE_NAME }}@${{ steps.model_tools_image.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          bash .github/scripts/release-images.sh publish \
            "$PRODUCTION" "$MODEL_TOOLS" "$VERSION" "$REVISION" "$PRERELEASE"

      - name: Attach immutable digests to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.production_image.outputs.digest }}
          MODEL_TOOLS_DIGEST: ${{ steps.model_tools_image.outputs.digest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cat > trtvideo-image-digest.txt <<EOF
          image=$IMAGE_NAME
          digest=$IMAGE_DIGEST
          release=$RELEASE_TAG
          source_revision=${{ steps.release.outputs.revision }}
          ubuntu_packages:
          EOF
          docker run --rm "$IMAGE_NAME@$IMAGE_DIGEST" \
            dpkg-query -W -f='  ${binary:Package}=${Version}\n' \
            ffmpeg libx264-164 >> trtvideo-image-digest.txt
          cat > trtvideo-model-tools-image-digest.txt <<EOF
          image=$MODEL_TOOLS_IMAGE_NAME
          digest=$MODEL_TOOLS_DIGEST
          release=$RELEASE_TAG
          source_revision=${{ steps.release.outputs.revision }}
          EOF
          gh release upload "$RELEASE_TAG" \
            trtvideo-image-digest.txt \
            trtvideo-model-tools-image-digest.txt \
            --clobber
          {
            echo "### Published images"
            echo
            echo "Production: \`$IMAGE_NAME@$IMAGE_DIGEST\`"
            echo
            echo "Model tools: \`$MODEL_TOOLS_IMAGE_NAME@$MODEL_TOOLS_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of registries
        if: always()
        run: |
          docker logout ghcr.io || true
          docker logout nvcr.io || true
