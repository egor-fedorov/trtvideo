name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build checks image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/checks.Dockerfile
          load: true
          tags: trtvideo:dev
          cache-from: type=gha,scope=checks
          cache-to: type=gha,mode=max,scope=checks

      - name: Run Ruff
        run: make lint

      - name: Run mypy
        run: make typecheck

      - name: Compile Python sources
        run: make compile

      - name: Run unit tests
        run: make test-unit

      - name: Run media integration tests
        run: make test-media-integration

      - name: Run CLI smoke tests
        run: make cli-smoke
