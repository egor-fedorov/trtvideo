services:
  upscale-ffmpeg:
    build: .
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./models:/app/models
      - ./videos:/app/videos
    entrypoint: upscale
    command:
      - --backend
      - ffmpeg
      - --engine
      - models/engines/model.engine
      - --input
      - videos/input.mp4

  upscale-nvcodec:
    build: .
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./models:/app/models
      - ./videos:/app/videos
    entrypoint: upscale
    command:
      - --backend
      - nvcodec
      - --engine
      - models/engines/model.engine
      - --input
      - videos/input.mp4
