[project]
name = "trtvideo"
version = "0.7.0"
description = "GPU-resident TensorRT video upscaling from compressed input to muxed output"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Egor Fyodorov" },
]
keywords = [
    "tensorrt",
    "nvenc",
    "nvdec",
    "cv-cuda",
    "video-upscaling",
    "real-esrgan",
    "gpu-inference",
    "super-resolution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/egor-fedorov/trtvideo"
Source = "https://github.com/egor-fedorov/trtvideo"
Issues = "https://github.com/egor-fedorov/trtvideo/issues"
Documentation = "https://github.com/egor-fedorov/trtvideo/blob/main/docs/ARCHITECTURE.md"
Changelog = "https://github.com/egor-fedorov/trtvideo/blob/main/docs/CHANGES.md"
"Benchmark Results" = "https://github.com/egor-fedorov/trtvideo/tree/main/benchmarks/results/rtx-3090"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
gpu = [
    "cuda-bindings>=13,<14",
    "pynvvideocodec>=2.2.4,<3",
    "cvcuda-cu13>=0.19,<1",
    "onnx>=1.16,<2",
    "nvidia-cuda-runtime>=13.5,<13.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorrt-cu13==11.5.0.63; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
demo = ["trtvideo[gpu,export]"]
docker = [
    "cuda-bindings>=13,<14",
    "pynvvideocodec>=2.2.4,<3",
    "cvcuda-cu13>=0.19,<1",
    "onnx>=1.16,<2",
]
benchmark = [
    "numpy>=2.0,<3",
    "nvidia-ml-py>=13.610,<14",
    "nvtx>=0.2,<1",
]
export = [
    "torch>=2.15,<2.16",
    "torchvision>=0.29.2,<0.30",
    "onnx>=1.16,<2",
    "onnxconverter-common>=1.16,<2",
    "onnxruntime>=1.23,<2",
    "onnxscript>=0.4,<1",
    "spandrel>=0.4,<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "matplotlib>=3.10,<4",
    "numpy>=2.0,<3",
    "onnx>=1.16,<2",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "ty==0.0.111",
]

[project.scripts]
trtvideo = "trtvideo.cli.main:main"
export-onnx = "trtvideo.cli.export_onnx:main"
prepare-onnx = "trtvideo.cli.prepare_onnx:main"
prepare-compatibility-input = "trtvideo.cli.prepare_compatibility_input:main"
build-engine = "trtvideo.cli.build_engine:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trtvideo*"]


[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
markers = [
    "unit: pure Python tests without GPU/runtime dependencies",
    "docker: Docker smoke tests",
    "gpu: GPU integration smoke tests",
    "benchmark: performance benchmark tests",
]


[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "models",
    "videos",
]

[tool.ruff.lint]
# Keep this gate practical for a CLI project: correctness, imports and simple refactors.
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = [
    # Hook method intentionally has no default behavior.
    "B027",
    # Manual frame counters are clearer in these streaming loops.
    "SIM113",
    # The NVENC raw bitstream file is intentionally kept open across methods.
    "SIM115",
]


[tool.mypy]
python_version = "3.12"
files = ["src/trtvideo", "benchmarks"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

disable_error_code = [
    # Heavy runtime libraries without stubs often collapse return values to Any.
    "no-any-return",
]


[tool.ty.environment]
python-version = "3.12"
python-platform = "linux"
root = ["./src", "."]

[tool.ty.src]
include = ["src/trtvideo", "benchmarks"]

[tool.ty.analysis]
# Keep mypy-specific suppressions independent from the second type checker.
respect-type-ignore-comments = false
# GPU and model-export dependencies are intentionally absent from the checks image.
allowed-unresolved-imports = [
    "PyNvVideoCodec",
    "cuda.bindings.runtime",
    "cvcuda",
    "nvtx",
    "onnx.**",
    "onnxconverter_common",
    "onnxruntime",
    "onnxscript",
    "spandrel",
    "tensorrt",
    "torch.**",
]
