[project]
name = "trtvideo"
version = "0.3.1"
description = "TensorRT video processing with GPU-resident upscale pipelines"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
gpu = [
    "cuda-bindings>=13,<14",
    "pynvvideocodec>=2.1,<3",
    "cvcuda-cu12>=0.16",
]
docker = [
    "cuda-bindings>=13,<14",
    "torch>=2.10,<3",
    "pynvvideocodec>=2.1,<3",
    "cvcuda-cu12>=0.16",
    "onnx>=1.16,<2",
    "onnxconverter-common>=1.16,<2",
    "onnxscript>=0.4,<1",
    "spandrel>=0.4,<1",
]
benchmark = [
    "numpy>=2.0,<3",
    "nvidia-ml-py>=13.610,<14",
]
export = [
    "torch>=2.10,<3",
    "onnx>=1.16,<2",
    "onnxconverter-common>=1.16,<2",
    "onnxscript>=0.4,<1",
    "spandrel>=0.4,<1",
]

[dependency-groups]
dev = [
    "numpy>=2.0,<3",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

[project.scripts]
upscale = "trtvideo.cli.upscale:main"
export-onnx = "trtvideo.cli.export_onnx:main"
prepare-onnx = "trtvideo.cli.prepare_onnx:main"
build-engine = "trtvideo.cli.build_engine:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trtvideo*"]


[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
markers = [
    "unit: pure Python tests without GPU/runtime dependencies",
    "docker: Docker smoke tests",
    "gpu: GPU integration smoke tests",
    "benchmark: performance benchmark tests",
]


[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "models",
    "videos",
]

[tool.ruff.lint]
# Keep this gate practical for a CLI project: correctness, imports and simple refactors.
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = [
    # Hook method intentionally has no default behavior.
    "B027",
    # Manual frame counters are clearer in these streaming loops.
    "SIM113",
    # The NVENC raw bitstream file is intentionally kept open across methods.
    "SIM115",
]


[tool.mypy]
python_version = "3.12"
files = ["src/trtvideo", "benchmarks"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

disable_error_code = [
    # Pipelines initialize optional lifecycle fields during BasePipeline.run().
    "union-attr",
    # Heavy runtime libraries without stubs often collapse return values to Any.
    "no-any-return",
]
