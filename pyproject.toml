[project]
name = "ai-video-upscaler"
version = "0.1.0"
description = "AI video upscaler via TensorRT with RealESRGAN and SPAN models"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
ffmpeg = [
    "torch>=2.10,<3",
    "tensorrt>=10.16,<11",
]
gpu = [
    "torch>=2.10,<3",
    "tensorrt>=10.16,<11",
    "pynvvideocodec>=2.1,<3",
    "cvcuda-cu12>=0.16",
]
docker = [
    "torch>=2.10,<3",
    "pynvvideocodec>=2.1,<3",
    "cvcuda-cu12>=0.16",
    "onnx>=1.16,<2",
    "basicsr>=1.4,<2",
]
export = [
    "torch>=2.10,<3",
    "onnx>=1.16,<2",
    "basicsr>=1.4,<2",
]
dev = [
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

[project.scripts]
upscale-video = "inference:main"
upscale-video-nvcodec = "inference_gpu:main"
upscale = "inference:main"
upscale-gpu = "inference_gpu:main"
export-onnx = "tools.export_onnx:main"
prepare-onnx = "tools.prepare_onnx:main"
build-engine = "tools.build_engine:main"
benchmark = "benchmark:main"
benchmark-video = "benchmark:main"

[tool.setuptools]
py-modules = ["benchmark", "inference", "inference_gpu"]
packages = ["upscaler", "tools"]


[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "models",
    "videos",
]

[tool.ruff.lint]
# Keep this gate practical for a CLI project: correctness, imports and simple refactors.
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = [
    # Hook method intentionally has no default behavior.
    "B027",
    # Manual frame counters are clearer in these streaming loops.
    "SIM113",
    # The NVENC raw bitstream file is intentionally kept open across methods.
    "SIM115",
]


[tool.mypy]
python_version = "3.10"
files = ["inference.py", "inference_gpu.py", "tools", "upscaler"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

disable_error_code = [
    # Existing pipelines initialize these fields during BasePipeline.run().
    # Stage 1B should replace this with explicit runtime interfaces.
    "union-attr",
    # Heavy runtime libraries without stubs often collapse return values to Any.
    "no-any-return",
]
